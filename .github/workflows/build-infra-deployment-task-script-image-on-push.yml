name: Build Script Image on Push

on:
  push:
    branches:
      - main
    paths:
      - update-infra-deployments-task-scripts-image/Dockerfile

env:
  REGISTRY: quay.io/redhat-appstudio
  IMAGE_NAME: update-infra-deployments-task-script-image

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Log in to Red Hat Registry
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
      with:
        registry: registry.redhat.io
        username: ${{ secrets.REGISTRY_REDHAT_IO_USER }}
        password: ${{ secrets.REGISTRY_REDHAT_IO_PASSWORD }}

    - name: Build Image
      id: build-image
      uses: redhat-actions/buildah-build@3a51aade9afa17e5c78256bcbe2e1ee08c7b995b # v3.0.2
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: ${{ github.sha }}
        context: .
        containerfiles: |
            ./update-infra-deployments-task-scripts-image/Dockerfile

    - name: Push to Quay
      uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
      with:
        image: ${{ steps.build-image.outputs.image }}
        tags: ${{ steps.build-image.outputs.tags }}
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}
