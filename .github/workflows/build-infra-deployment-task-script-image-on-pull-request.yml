name: Build Script Image on PR

on:
  workflow_run:
    workflows: ["Check Author"]
    types:
      - completed

env:
  REGISTRY: quay.io/redhat-appstudio
  IMAGE_NAME: update-infra-deployments-task-script-image

jobs:
  build-on-pr:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Log in to Red Hat Registry
      uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
      with:
        registry: registry.redhat.io
        username: ${{ secrets.REGISTRY_REDHAT_IO_USER }}
        password: ${{ secrets.REGISTRY_REDHAT_IO_PASSWORD }}

    - name: Build Image
      id: build-image
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
      with:
        image: ${{ env.IMAGE_NAME }}
        tags: ${{ github.sha }}
        context: .
        containerfiles: |
            ./update-infra-deployments-task-scripts-image/Dockerfile
